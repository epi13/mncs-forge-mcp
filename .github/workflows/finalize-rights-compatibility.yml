name: Finalize Rights Compatibility

on:
  push:
    branches: [finalize-rights-provenance-compatibility]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: finalize-rights-provenance-compatibility
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Generate canonical compatibility snapshot
        run: python scripts/generate-compatibility-snapshot.py --write
      - name: Verify generated snapshot
        run: python scripts/generate-compatibility-snapshot.py --check
      - name: Remove temporary diagnostic tooling
        run: |
          git rm -f .github/workflows/diagnose-compatibility.yml || true
          git rm -f .github/workflows/finalize-rights-compatibility.yml
      - name: Validate resulting tree
        run: |
          ruff format --check .
          ruff check .
          mypy src
          pytest tests/test_compatibility.py tests/test_rights_provenance.py tests/test_cli_mcp_edgestream.py
      - name: Commit final compatibility evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/compatibility/0.1.0b1.json
          git diff --cached --check
          git commit -m "Finalize rights provenance compatibility evidence"
          git push origin HEAD:finalize-rights-provenance-compatibility
