name: Fix Rights Lint Helper

on:
  push:
    branches: [integrate-rights-provenance]

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.15.22
      - name: Wrap provenance note
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/mncs_forge/application/rights_provenance.py')
          text = path.read_text()
          old = '            "notes": "Forge-derived draft: unknown fields remain explicit until supplied evidence resolves them.",\n'
          new = '            "notes": (\n                "Forge-derived draft: unknown fields remain explicit until supplied evidence "\n                "resolves them."\n            ),\n'
          if old not in text:
              raise SystemExit('target provenance note not found')
          path.write_text(text.replace(old, new))
          PY
      - run: ruff check --fix src/mncs_forge/config.py src/mncs_forge/paths.py src/mncs_forge/application/rights_provenance.py
      - run: ruff format src/mncs_forge/config.py src/mncs_forge/paths.py src/mncs_forge/application/rights_provenance.py
      - run: ruff check src/mncs_forge/config.py src/mncs_forge/paths.py src/mncs_forge/application/rights_provenance.py
      - uses: actions/upload-artifact@v4
        with:
          name: lint-fixed-rights-provenance
          path: |
            src/mncs_forge/config.py
            src/mncs_forge/paths.py
            src/mncs_forge/application/rights_provenance.py
