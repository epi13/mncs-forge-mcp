name: Format Rights Provenance Helper

on:
  push:
    branches: [integrate-rights-provenance]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.15.22
      - run: >-
          ruff format
          src/mncs_forge/application/evidence.py
          src/mncs_forge/application/rights_provenance.py
          src/mncs_forge/config.py
          tests/test_rights_provenance.py
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-rights-provenance
          path: |
            src/mncs_forge/application/evidence.py
            src/mncs_forge/application/rights_provenance.py
            src/mncs_forge/config.py
            tests/test_rights_provenance.py
